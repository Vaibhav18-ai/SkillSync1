<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillSync: Student dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--bg:#f5f7fb;--card:#fff;--ink:#14213d;--mute:#5d6b85;--line:#e0e6f0;--brand:#0d8f83;--soft:#e0f4f1;--warn:#c2410c;--track:#e6ebf3}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .logo{font-weight:700;font-size:1.3rem}.logo span{color:var(--brand)}
  a{color:var(--brand);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  h2{margin:24px 0 12px;font-size:1.25rem} h3{margin:0 0 4px;font-size:1.05rem}
  .muted{color:var(--mute);font-size:.92rem}
  .big{font-size:2.6rem;font-weight:700;color:var(--brand);line-height:1}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .btn{border:0;background:var(--brand);color:#fff;padding:9px 16px;border-radius:10px;font:600 .95rem system-ui;cursor:pointer}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)} .btn:disabled{opacity:.55;cursor:default}
  .badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--brand);font-size:.82rem;font-weight:600}
  .badge.warn{background:#ffedd5;color:var(--warn)}
  .bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--brand)}
  .skill{margin:10px 0;font-size:.93rem}.skill .row{font-weight:600}
  .chip{display:inline-block;background:var(--track);border-radius:8px;padding:2px 9px;margin:2px 3px 2px 0;font-size:.85rem}
  .chip.lead{background:var(--brand);color:#fff;font-weight:600}
  .box{position:relative;height:260px}
  #msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;max-width:90vw}
  #msg.show{opacity:1}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Skill<span>Sync</span></div>
    <div><span id="who" class="muted"></span> <button class="btn ghost" onclick="logout()">Log out</button></div>
  </header>

  <div class="grid g2">
    <div class="card">
      <div class="muted">Your overall score (out of 10)</div>
      <div class="big" id="gscore">–</div>
      <div id="skills"></div>
    </div>
    <div class="card"><h3>Skill strengths</h3><div class="box"><canvas id="radar"></canvas></div></div>
  </div>

  <h2>Your team</h2>
  <div id="teams" class="grid g3"><p class="muted">No team yet. Teams appear here after the coordinator publishes them.</p></div>

  <h2>Competitions</h2>
  <div id="comps" class="grid g3"></div>
</div>
<div id="msg" role="status"></div>

<script src="api.js"></script>
<script>
const me = requireRole("student");
document.getElementById("who").textContent = me.name;
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){ const m=$("#msg"); m.textContent=t; m.classList.add("show"); setTimeout(()=>m.classList.remove("show"),3500); }

let radar;
async function loadProfile(){
  const d = await api("/students/me");
  $("#gscore").textContent = d.general_score.toFixed(1);
  $("#skills").innerHTML = d.skills.slice(0,6).map(s =>
    `<div class="skill"><div class="row"><span>${esc(s.name)}</span><span>${s.score.toFixed(1)}</span></div>
     <div class="bar"><i style="width:${s.score*10}%"></i></div></div>`).join("")
    || '<p class="muted">Add your skills to get a score.</p>';
  if (radar) radar.destroy();
  const top = d.skills.slice(0,6);
  if (top.length >= 3) radar = new Chart($("#radar"), {type:"radar",
    data:{labels:top.map(s=>s.name), datasets:[{data:top.map(s=>s.score), borderColor:"#0d8f83", backgroundColor:"rgba(13,143,131,.2)"}]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{r:{min:0,max:10,ticks:{display:false}}}}});
}

async function loadComps(){
  const list = await api("/competitions");
  $("#comps").innerHTML = list.length ? list.map(c => {
    const joined = c.my_status === "confirmed";
    const open = c.status === "registration_open";
    const state = joined ? '<span class="badge">Joined</span>'
      : !c.eligible ? `<span class="badge warn">Needs: ${esc(c.missing.join(", "))}</span>` : "";
    return `<div class="card">
      <div class="row"><h3>${esc(c.name)}</h3><b style="color:var(--brand);font-size:1.3rem">${c.my_fit.toFixed(1)}</b></div>
      <p class="muted">${esc(c.description || "")}</p>
      <p class="muted">Status: ${esc(c.status.replace(/_/g," "))}</p>${state}
      ${open && !joined && c.eligible ? `<div style="margin-top:10px"><label><input type="checkbox" id="lead${c.id}"> I’d like to lead a team</label><br>
        <button class="btn" style="margin-top:8px" onclick="apply(${c.id})">Apply</button></div>` : ""}
    </div>`;
  }).join("") : '<p class="muted">No competitions are open yet.</p>';

  const mine = list.filter(c => c.my_status === "confirmed" && ["finalized","ongoing","completed"].includes(c.status));
  if (mine.length) {
    const cards = await Promise.all(mine.map(async c => {
      try {
        const t = (await api(`/competitions/${c.id}/teams`))[0];
        const link = t.team_id ? `team-dashboard.html?team=${t.team_id}` : "team-dashboard.html";
        return `<div class="card"><h3>${esc(c.name)}</h3>
          <p class="muted">Team ${t.team_no}, average score ${t.avg_score.toFixed(2)}</p>
          ${t.members.map(m=>`<span class="chip ${m.is_leader?"lead":""}">${esc(m.name)}${m.is_leader?" (leader)":""}</span>`).join("")}
          <p style="margin:12px 0 0"><a href="${link}">Open team workspace</a></p></div>`;
      } catch { return ""; }
    }));
    $("#teams").innerHTML = cards.join("") || $("#teams").innerHTML;
  }
}

async function apply(id){
  try {
    const lead = document.getElementById("lead"+id).checked;
    await api(`/competitions/${id}/applications`, {method:"POST", body:{wants_to_lead:lead}});
    toast("You have joined this competition."); loadComps();
  } catch (e) { toast(e.message); }
}

Promise.all([loadProfile(), loadComps()]).catch(e => toast(e.message));
</script>
</body>
</html>
